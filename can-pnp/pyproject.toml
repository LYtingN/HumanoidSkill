[project]
name = "can-pnp"
version = "0.1.0"
description = "Can pick-and-place scene (G1 + ALOHA 2 grippers, table, shelf, box) ported from motion_token_residual_rl Isaac Lab to mjlab / MuJoCo Warp"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  # Same mjlab commit as supermimic-reproduced.
  "mjlab",
  "torch>=2.14.0",
  # PyPI's warp-lang is built for CUDA 13 (driver >= 580); our hosts run 550 / 570, so Linux
  # x86_64 uses the +cu12 release build from the local "warp-cu12" index (wheels/).
  "warp-lang==1.18.0+cu12; sys_platform == 'linux' and platform_machine == 'x86_64'",
  "warp-lang>=1.15.0; sys_platform != 'linux' or platform_machine != 'x86_64'",
  "mujoco-warp~=3.16.0",
  "mujoco~=3.16.0",
  "numpy",
  "pillow",
  "pyarrow",
  "tyro>=1.0.1",
]

[project.optional-dependencies]
# Humanoid-Diffusion inference (the policy code itself is imported from its checkout).
diffusion = ["timm>=1.0.20,<2", "diffusers>=0.30,<1", "torchvision"]

[project.scripts]
can-pnp-check = "can_pnp.scripts.check_scene:main"
can-pnp-run = "can_pnp.scripts.run_pipeline:main"
can-pnp-dsrl = "can_pnp.scripts.train_dsrl:main"

[dependency-groups]
dev = [
  "pytest>=8.0",
  "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/can_pnp"]

[tool.uv]
# mjlab routes warp-lang to pypi.nvidia.com (CUDA 13 builds); override its requirement so the
# CUDA 12 build below is used everywhere.
override-dependencies = [
  "warp-lang==1.18.0+cu12; sys_platform == 'linux' and platform_machine == 'x86_64'",
  "warp-lang>=1.15.0; sys_platform != 'linux' or platform_machine != 'x86_64'",
]

[tool.uv.sources]
mjlab = { git = "https://github.com/mujocolab/mjlab", rev = "8bb2bc9e187797689ec82c78c35019afd2fd0376" }
# remote-26 runs driver 550 (CUDA <= 12.8): use the cu126 build instead of supermimic's cu130.
torch = { index = "pytorch-cu126", marker = "sys_platform != 'darwin'" }
torchvision = { index = "pytorch-cu126", marker = "sys_platform != 'darwin'" }
warp-lang = { index = "warp-cu12", marker = "sys_platform == 'linux' and platform_machine == 'x86_64'" }

# PyPI is uv's default index; on slow links point it at a mirror for the sync, e.g.
#   UV_DEFAULT_INDEX=https://mirrors.ustc.edu.cn/pypi/simple uv sync
# Local flat index holding the CUDA 12 warp-lang build (scripts/fetch_wheels.sh).
[[tool.uv.index]]
name = "warp-cu12"
url = "wheels"
format = "flat"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
