[project]
name = "can-pnp"
version = "0.1.0"
description = "Can pick-and-place task and scene for G1 + ALOHA"
requires-python = ">=3.12,<3.13"
dependencies = [
  "hskill",
  "mjlab",
  "torch>=2.14.0",
  "mujoco~=3.16.0",
  "numpy",
  "pillow",
  "tyro>=1.0.1",
]

[project.scripts]
can-pnp-check = "can_pnp.scripts.check_scene:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/can_pnp"]
