<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="910" viewBox="0 0 1500 910" font-family="PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker>
    <marker id="aB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker>
    <marker id="aR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker>
    <marker id="aT" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0f766e"/></marker>
    <marker id="aO" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d97706"/></marker>
  </defs>

  <rect width="1500" height="910" fill="#ffffff"/>

  <!-- Title -->
  <text x="30" y="42" font-size="22" font-weight="700" fill="#0f172a">S1 高层策略架构：DiT Flow Matching + Dynamic Query（Physical Alignment）</text>
  <text x="30" y="68" font-size="13" fill="#475569">vision = 世界现在是什么样；action = 我想做什么（计划 r）；dynamic query = 这个计划交给当前 S0 会执行成什么样（Φ̂）</text>

  <!-- Legend -->
  <line x1="1090" y1="34" x2="1130" y2="34" stroke="#334155" stroke-width="1.6" marker-end="url(#a)"/>
  <text x="1140" y="38" font-size="12" fill="#334155">信息流（A 读 B：信息从 B 流向 A）</text>
  <line x1="1090" y1="56" x2="1130" y2="56" stroke="#2563eb" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#aB)"/>
  <text x="1140" y="60" font-size="12" fill="#1d4ed8">仅 post-train 打开</text>
  <line x1="1090" y1="78" x2="1130" y2="78" stroke="#dc2626" stroke-width="1.6" stroke-dasharray="2 3" marker-end="url(#aR)"/>
  <text x="1140" y="82" font-size="12" fill="#b91c1c">训练信号</text>

  <!-- Inputs -->
  <rect x="30" y="120" width="200" height="34" rx="8" fill="#f1f5f9" stroke="#94a3b8"/>
  <text x="130" y="142" font-size="13" text-anchor="middle" fill="#0f172a">头部相机图像</text>
  <line x1="130" y1="154" x2="130" y2="168" stroke="#334155" stroke-width="1.6" marker-end="url(#a)"/>
  <rect x="30" y="170" width="200" height="34" rx="8" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="130" y="192" font-size="13" text-anchor="middle" fill="#1e3a8a">DINOv3（冻结）</text>
  <rect x="30" y="222" width="200" height="34" rx="8" fill="#f1f5f9" stroke="#94a3b8"/>
  <text x="130" y="244" font-size="13" text-anchor="middle" fill="#0f172a">本体状态 s</text>

  <!-- Attention mask inset -->
  <text x="30" y="300" font-size="13" font-weight="700" fill="#0f172a">attention mask（行 = 读者，列 = 被读）</text>
  <text x="110" y="327" font-size="13" font-weight="700" text-anchor="middle" fill="#1e40af">V</text>
  <text x="160" y="327" font-size="13" font-weight="700" text-anchor="middle" fill="#15803d">Q</text>
  <text x="210" y="327" font-size="13" font-weight="700" text-anchor="middle" fill="#c2410c">A</text>
  <text x="65" y="360" font-size="13" font-weight="700" text-anchor="middle" fill="#1e40af">V</text>
  <text x="65" y="400" font-size="13" font-weight="700" text-anchor="middle" fill="#15803d">Q</text>
  <text x="65" y="440" font-size="13" font-weight="700" text-anchor="middle" fill="#c2410c">A</text>
  <g stroke="#cbd5e1" stroke-width="1">
    <rect x="85" y="335" width="50" height="40" fill="#dcfce7"/>
    <rect x="135" y="335" width="50" height="40" fill="#f1f5f9"/>
    <rect x="185" y="335" width="50" height="40" fill="#f1f5f9"/>
    <rect x="85" y="375" width="50" height="40" fill="#dcfce7"/>
    <rect x="135" y="375" width="50" height="40" fill="#dcfce7"/>
    <rect x="185" y="375" width="50" height="40" fill="#dcfce7"/>
    <rect x="85" y="415" width="50" height="40" fill="#dcfce7"/>
    <rect x="135" y="415" width="50" height="40" fill="#dbeafe"/>
    <rect x="185" y="415" width="50" height="40" fill="#dcfce7"/>
  </g>
  <g font-size="15" text-anchor="middle">
    <text x="110" y="360" fill="#15803d">✓</text>
    <text x="160" y="360" fill="#94a3b8">✗</text>
    <text x="210" y="360" fill="#94a3b8">✗</text>
    <text x="110" y="400" fill="#15803d">✓</text>
    <text x="160" y="400" fill="#15803d">✓</text>
    <text x="210" y="400" fill="#15803d">✓</text>
    <text x="110" y="440" fill="#15803d">✓</text>
    <text x="160" y="440" fill="#1d4ed8">✓*</text>
    <text x="210" y="440" fill="#15803d">✓</text>
  </g>
  <text x="30" y="480" font-size="11" fill="#1d4ed8">* A 读 Q：pretrain 关，post-train 开</text>
  <text x="30" y="498" font-size="11" fill="#475569">V 不读 Q / A：观测编码保持干净</text>
  <text x="30" y="516" font-size="11" fill="#475569">Q 读 A：预测 e(r)，标签只取决于 S0</text>

  <!-- DiT block -->
  <rect x="290" y="100" width="640" height="500" rx="14" fill="#f8fafc" stroke="#334155" stroke-width="1.5"/>
  <text x="610" y="128" font-size="16" font-weight="700" text-anchor="middle" fill="#0f172a">S1：DiT（Flow Matching）× N 层</text>
  <text x="610" y="148" font-size="12" text-anchor="middle" fill="#64748b">τ 经 adaLN 注入每一层；DINOv3 特征在各去噪步之间复用</text>

  <!-- Vision lane -->
  <rect x="390" y="165" width="510" height="70" rx="10" fill="#dbeafe" stroke="#3b82f6"/>
  <g fill="#3b82f6" opacity="0.85">
    <rect x="405" y="192" width="16" height="16" rx="3"/><rect x="425" y="192" width="16" height="16" rx="3"/>
    <rect x="445" y="192" width="16" height="16" rx="3"/><rect x="465" y="192" width="16" height="16" rx="3"/>
    <rect x="485" y="192" width="16" height="16" rx="3"/><rect x="505" y="192" width="16" height="16" rx="3"/>
    <rect x="525" y="192" width="16" height="16" rx="3"/><rect x="545" y="192" width="16" height="16" rx="3" fill="#1e3a8a"/>
  </g>
  <text x="580" y="194" font-size="14" font-weight="700" fill="#1e3a8a">vision tokens + state token</text>
  <text x="580" y="215" font-size="12" fill="#1e40af">条件：世界现在是什么样（不随 τ 变）</text>

  <!-- Query lane -->
  <rect x="390" y="320" width="510" height="70" rx="10" fill="#dcfce7" stroke="#16a34a"/>
  <g fill="#16a34a" opacity="0.85">
    <rect x="405" y="347" width="16" height="16" rx="3"/><rect x="425" y="347" width="16" height="16" rx="3"/>
    <rect x="445" y="347" width="16" height="16" rx="3"/><rect x="465" y="347" width="16" height="16" rx="3"/>
  </g>
  <text x="500" y="349" font-size="14" font-weight="700" fill="#14532d">dynamic queries（K 个可学习向量）</text>
  <text x="500" y="370" font-size="12" fill="#166534">物理评估 Φ̂：这个计划交给当前 S0 会执行成什么样</text>

  <!-- Action lane -->
  <rect x="390" y="475" width="510" height="70" rx="10" fill="#ffedd5" stroke="#ea580c"/>
  <g fill="#ea580c" opacity="0.85">
    <rect x="405" y="502" width="16" height="16" rx="3"/><rect x="425" y="502" width="16" height="16" rx="3"/>
    <rect x="445" y="502" width="16" height="16" rx="3"/><rect x="465" y="502" width="16" height="16" rx="3"/>
    <rect x="485" y="502" width="16" height="16" rx="3"/><rect x="505" y="502" width="16" height="16" rx="3"/>
    <rect x="525" y="502" width="16" height="16" rx="3"/><rect x="545" y="502" width="16" height="16" rx="3"/>
  </g>
  <text x="580" y="504" font-size="14" font-weight="700" fill="#7c2d12">action tokens x_τ（32 帧）</text>
  <text x="580" y="525" font-size="12" fill="#9a3412">要求解的变量：计划 r（每个去噪步都在变）</text>

  <!-- Inputs into the vision lane (drawn over the DiT box) -->
  <line x1="230" y1="187" x2="386" y2="187" stroke="#334155" stroke-width="1.6" marker-end="url(#a)"/>
  <line x1="230" y1="239" x2="386" y2="212" stroke="#334155" stroke-width="1.6" marker-end="url(#a)"/>

  <!-- Reads between lanes -->
  <line x1="470" y1="237" x2="470" y2="316" stroke="#334155" stroke-width="1.6" marker-end="url(#a)"/>
  <text x="482" y="282" font-size="12" fill="#334155">Q 读 V（场景）</text>

  <line x1="500" y1="473" x2="500" y2="394" stroke="#334155" stroke-width="1.6" marker-end="url(#a)"/>
  <text x="512" y="427" font-size="12" fill="#334155">Q 读 A（计划）</text>
  <text x="512" y="445" font-size="11" fill="#64748b">初期对 A 的 K/V stop-grad</text>

  <line x1="720" y1="392" x2="720" y2="471" stroke="#2563eb" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#aB)"/>
  <text x="732" y="427" font-size="12" fill="#1d4ed8">A 读 Q（guidance）</text>
  <text x="732" y="445" font-size="11" fill="#1d4ed8">pretrain 关 / post-train 开</text>

  <path d="M 390 228 H 345 V 525 H 386" fill="none" stroke="#334155" stroke-width="1.6" marker-end="url(#a)"/>
  <text transform="translate(330,380) rotate(-90)" font-size="12" text-anchor="middle" fill="#334155">A 读 V（场景）</text>

  <!-- Inputs below DiT -->
  <rect x="400" y="640" width="230" height="36" rx="8" fill="#ffedd5" stroke="#ea580c"/>
  <text x="515" y="663" font-size="13" text-anchor="middle" fill="#7c2d12">初始噪声（τ = 0）→ x_τ</text>
  <line x1="515" y1="640" x2="515" y2="549" stroke="#334155" stroke-width="1.6" marker-end="url(#a)"/>
  <rect x="660" y="640" width="180" height="36" rx="8" fill="#f1f5f9" stroke="#94a3b8"/>
  <text x="750" y="663" font-size="13" text-anchor="middle" fill="#0f172a">flow time τ</text>
  <line x1="750" y1="640" x2="750" y2="604" stroke="#334155" stroke-width="1.6" marker-end="url(#a)"/>

  <!-- Query output -->
  <line x1="900" y1="355" x2="978" y2="355" stroke="#334155" stroke-width="1.6" marker-end="url(#a)"/>
  <rect x="980" y="335" width="140" height="40" rx="8" fill="#dcfce7" stroke="#16a34a"/>
  <text x="1050" y="360" font-size="13" text-anchor="middle" fill="#14532d">query head</text>
  <line x1="1120" y1="355" x2="1158" y2="355" stroke="#334155" stroke-width="1.6" marker-end="url(#a)"/>
  <rect x="1160" y="325" width="300" height="60" rx="8" fill="#dcfce7" stroke="#16a34a"/>
  <text x="1310" y="350" font-size="13" font-weight="700" text-anchor="middle" fill="#14532d">ê：tracking error 预测</text>
  <text x="1310" y="371" font-size="11" text-anchor="middle" fill="#166534">ê ≈ Φ − kp(r)，5 keypoints × 32 帧（可加 Φ_rel）</text>

  <!-- Action output -->
  <line x1="900" y1="510" x2="978" y2="510" stroke="#334155" stroke-width="1.6" marker-end="url(#a)"/>
  <rect x="980" y="490" width="140" height="40" rx="8" fill="#ffedd5" stroke="#ea580c"/>
  <text x="1050" y="515" font-size="13" text-anchor="middle" fill="#7c2d12">速度 v</text>
  <line x1="1120" y1="510" x2="1158" y2="510" stroke="#334155" stroke-width="1.6" marker-end="url(#a)"/>
  <rect x="1160" y="485" width="300" height="50" rx="8" fill="#fff7ed" stroke="#ea580c"/>
  <text x="1310" y="507" font-size="13" font-weight="700" text-anchor="middle" fill="#7c2d12">ODE 积分（K 步去噪）</text>
  <text x="1310" y="526" font-size="11" text-anchor="middle" fill="#9a3412">每步把新的 x_τ 送回 DiT</text>
  <line x1="1310" y1="535" x2="1310" y2="568" stroke="#334155" stroke-width="1.6" marker-end="url(#a)"/>
  <rect x="1160" y="570" width="300" height="56" rx="8" fill="#ffedd5" stroke="#ea580c" stroke-width="1.6"/>
  <text x="1310" y="594" font-size="14" font-weight="700" text-anchor="middle" fill="#7c2d12">r：32 帧全身 reference</text>
  <text x="1310" y="614" font-size="11" text-anchor="middle" fill="#9a3412">29 关节 + 2 夹爪 + 6D root</text>
  <line x1="1310" y1="626" x2="1310" y2="658" stroke="#d97706" stroke-width="1.6" marker-end="url(#aO)"/>
  <rect x="1200" y="660" width="220" height="40" rx="8" fill="#fef3c7" stroke="#d97706"/>
  <text x="1310" y="685" font-size="13" font-weight="700" text-anchor="middle" fill="#92400e">5 keypoints（硬目标）</text>

  <!-- KV cache (clean pass) -->
  <path d="M 1160 598 H 1060 V 698" fill="none" stroke="#0f766e" stroke-width="1.6" stroke-dasharray="5 3" marker-end="url(#aT)"/>
  <text x="1068" y="650" font-size="11" fill="#0f766e">x = r</text>
  <line x1="915" y1="602" x2="958" y2="698" stroke="#0f766e" stroke-width="1.6" marker-end="url(#aT)"/>
  <text x="943" y="640" font-size="11" fill="#0f766e">再前向一次</text>
  <rect x="875" y="700" width="250" height="52" rx="8" fill="#ccfbf1" stroke="#0f766e"/>
  <text x="1000" y="721" font-size="13" font-weight="700" text-anchor="middle" fill="#134e4a">KV cache（clean pass，τ = 1）</text>
  <text x="1000" y="741" font-size="11" text-anchor="middle" fill="#115e59">取自 vision + action token，不含 query</text>

  <!-- S0 -->
  <line x1="1000" y1="752" x2="1000" y2="788" stroke="#0f766e" stroke-width="1.6" marker-end="url(#aT)"/>
  <line x1="1310" y1="700" x2="1310" y2="788" stroke="#d97706" stroke-width="1.6" marker-end="url(#aO)"/>
  <rect x="420" y="790" width="1040" height="64" rx="12" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="940" y="817" font-size="15" font-weight="700" text-anchor="middle" fill="#4c1d95">S0：SuperMimic（冻结）+ 残差 head（读 KV） → MuJoCo 仿真（can-pnp）</text>
  <text x="940" y="839" font-size="12" text-anchor="middle" fill="#5b21b6">输出：实际执行轨迹 Φ、任务成功与否</text>

  <!-- Training objectives -->
  <rect x="30" y="640" width="340" height="170" rx="10" fill="#fef2f2" stroke="#dc2626"/>
  <text x="45" y="665" font-size="14" font-weight="700" fill="#991b1b">训练目标</text>
  <text x="45" y="690" font-size="12" fill="#7f1d1d">L_FM：pretrain = 演示 BC</text>
  <text x="45" y="710" font-size="12" fill="#7f1d1d">　　　post-train = 按 S0 执行结果加权</text>
  <text x="45" y="738" font-size="12" fill="#7f1d1d">L_track = ‖ê − (Φ − kp(r))‖²</text>
  <text x="45" y="758" font-size="12" fill="#7f1d1d">　　　仅 post-train，标签来自当前 S0 rollout</text>
  <text x="45" y="790" font-size="12" fill="#7f1d1d">交替：S0 更新 → 重新 rollout → 重新标注</text>
  <line x1="420" y1="822" x2="374" y2="822" stroke="#dc2626" stroke-width="1.6" stroke-dasharray="2 3" marker-end="url(#aR)"/>
  <text x="397" y="814" font-size="11" text-anchor="middle" fill="#b91c1c">Φ、成功</text>
  <line x1="330" y1="640" x2="330" y2="604" stroke="#dc2626" stroke-width="1.6" stroke-dasharray="2 3" marker-end="url(#aR)"/>
  <text x="338" y="626" font-size="11" fill="#b91c1c">梯度</text>

  <!-- Footnote -->
  <text x="30" y="890" font-size="11" fill="#64748b">注：Humanoid-Diffusion 的实际 token 结构（单序列 self-attention 或 cross-attention 式 DiT）待确认，本图按单序列 + attention mask 绘制。</text>
</svg>
